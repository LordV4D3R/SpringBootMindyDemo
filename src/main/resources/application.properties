# ==========================================
# CẤU HÌNH SERVER & ỨNG DỤNG
# ==========================================
server.port=8080
spring.application.name=spring-boot-jpa-demo

# ==========================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU H2 IN-MEMORY
# ==========================================
# H2 chạy hoàn toàn trong RAM, tự sinh bảng khi khởi động và hủy khi tắt app
spring.datasource.url=jdbc:h2:mem:hsf_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bật giao diện web H2 Console để xem bảng và dữ liệu trực quan tại: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==========================================
# CẤU HÌNH HIBERNATE / JPA
# ==========================================
# Tự động tạo lại bảng mỗi khi chạy ứng dụng
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hiển thị câu lệnh SQL và format thụt đầu dòng đẹp mắt ra console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Log chi tiết các tham số truyền vào dấu hỏi chấm (?) trong câu SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
